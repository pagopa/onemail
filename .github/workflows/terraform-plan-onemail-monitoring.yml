name: Terraform Plan - OneMail Monitoring

on:
  pull_request:
    paths:
      - 'src/infra/src/70_domains/onemail_monitoring/**'
      - 'src/infra/src/data/tenants/tenants.json'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to plan'
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

jobs:
  setup-matrix:
    # Skip on pull_request from changeset-release/* branches (automated changeset release PRs)
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'changeset-release/') }}
    name: Setup Environment Matrix
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7 https://github.com/actions/checkout/releases/tag/v4.1.7

      - name: Setup Matrix
        id: matrix
        uses: ./.github/actions/env-matrix
        with:
          event_name: ${{ github.event_name }}
          environment_input: ${{ github.event.inputs.environment }}

  terraform-plan:
    name: Terraform Plan ${{ matrix.environment }}
    runs-on: ubuntu-22.04
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7 https://github.com/actions/checkout/releases/tag/v4.1.7

      - name: Run Terraform Plan
        uses: ./.github/actions/terraform-plan
        with:
          module: 70_domains/onemail_monitoring
          environment: ${{ matrix.environment }}
          region: ${{ matrix.region }}
          iac_role_plan_arn: ${{ vars.IAM_ROLE_IAC_PLAN }}
