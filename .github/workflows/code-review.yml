name: Code Review

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'src/onemail/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'eslint.config.mjs'
      - '.prettier*'
      - 'tsconfig.json'
      - 'tsconfig.*.json'

jobs:
  lint-and-test:
    name: Lint and test files
    runs-on: ubuntu-22.04
    if: ${{ github.event.pull_request.base.ref == 'main' && !startsWith(github.head_ref, 'changeset-release/') }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 https://github.com/actions/checkout/releases/tag/v4.3.1

      # call common node setup workflow
      - name: Setup Node.js
        uses: ./.github/actions/node-setup

      # install dependencies
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # start lint checking
      - name: Lint
        id: lint-check
        run: pnpm run lint:check

      # start code style checking
      - name: Format
        id: format-check
        run: pnpm run format:check

      # run TypeScript type checking
      - name: TypeScript type checking
        id: type-check
        run: pnpm run type-check

      # detect impacted packages for targeted unit tests
      - name: Detect impacted packages
        id: changed-packages
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5 https://github.com/tj-actions/changed-files/releases/tag/v47.0.5
        with:
          files_yaml: |
            shared:
              - package.json
              - pnpm-lock.yaml
              - tsconfig.json
              - tsconfig.*.json
              - src/onemail/om-common/**
              - src/onemail/viTestBase.shared.ts
              - src/onemail/vitest.shared.ts
            sender:
              - src/onemail/om-lambda-sender/**
            dispatcher:
              - src/onemail/om-ecs-dispatcher/**
            config_set_processor:
              - src/onemail/om-lambda-config-set-processor/**
            all_onemail:
              - src/onemail/**

      # run unit tests only for impacted packages; fallback to full run for shared changes
      - name: Unit tests
        id: unit-tests
        run: |
          if [[ "${{ steps.changed-packages.outputs.shared_any_changed }}" == "true" ]]; then
            echo "Shared/global changes detected. Running full test coverage suite."
            pnpm run test:coverage
            exit 0
          fi

          ran_any_test="false"

          if [[ "${{ steps.changed-packages.outputs.sender_any_changed }}" == "true" ]]; then
            echo "Running sender test coverage."
            pnpm --filter om-lambda-sender test:coverage
            ran_any_test="true"
          fi

          if [[ "${{ steps.changed-packages.outputs.dispatcher_any_changed }}" == "true" ]]; then
            echo "Running ecs dispatcher test coverage."
            pnpm --filter om-ecs-dispatcher test:coverage
            ran_any_test="true"
          fi

          if [[ "${{ steps.changed-packages.outputs.config_set_processor_any_changed }}" == "true" ]]; then
            echo "Running config-set-processor test coverage."
            pnpm --filter om-lambda-config-set-processor test:coverage
            ran_any_test="true"
          fi

          if [[ "$ran_any_test" == "false" && "${{ steps.changed-packages.outputs.all_onemail_any_changed }}" == "true" ]]; then
            echo "Detected onemail changes outside known package mapping. Running full test coverage suite."
            pnpm run test:coverage
            ran_any_test="true"
          fi

          if [[ "$ran_any_test" == "false" ]]; then
            echo "No impacted package requires unit tests in this workflow scope."
          fi
