name: Deploy ECS Dispatcher

permissions: {}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-ecs-dispatcher.yml
      - src/onemail/om-ecs-dispatcher/CHANGELOG.md
      - src/onemail/om-common/CHANGELOG.md
  workflow_dispatch:
    inputs:
      environment:
        description: Choose environment
        type: choice
        required: true
        default: dev
        options:
          - dev
          - uat
          - prod

# Never cancel an in-flight deploy to avoid leaving ECS in a partial state
# It prevents issues where multiple commits are pushed in a short time, which would trigger multiple deploys and cancel the previous ones, potentially leaving the app in a broken state if the last deploy fails.
concurrency:
  group: deploy-ecs-dispatcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Set deployment matrix
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup Matrix
        id: matrix
        uses: ./.github/actions/env-matrix
        with:
          event_name: ${{ github.event_name }}
          environment_input: ${{ github.event.inputs.environment }}

  deploy:
    name: Deploy on ECS ${{ matrix.environment }}-${{ matrix.region }}
    needs: setup
    if: ${{ needs.setup.outputs.matrix != '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    continue-on-error: false
    environment: ${{ matrix.environment == 'prod' && format('{0}/{1}', matrix.environment, matrix.region) || matrix.environment }}
    env:
      AWS_REGION: ${{ matrix.region }}
      ENV_SHORT: ${{ fromJSON('{"dev":"d","uat":"u","prod":"p"}')[matrix.environment] }}
      REGION_SHORT: ${{ fromJSON('{"eu-south-1":"es-1","eu-central-1":"ec-1"}')[matrix.region] }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 https://github.com/actions/checkout/releases/tag/v4.2.2

      - name: Get Node version from .nvmrc
        id: node-version
        run: echo "version=$(cat .nvmrc | tr -d 'v')" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2 https://github.com/aws-actions/configure-aws-credentials/releases/tag/v4.0.2
        with:
          role-to-assume: ${{ vars.IAM_ROLE_DEPLOY_ECS }}
          aws-region: ${{ matrix.region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1 https://github.com/aws-actions/amazon-ecr-login/releases/tag/v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1 https://github.com/docker/setup-buildx-action/releases/tag/v3.7.1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0 https://github.com/docker/build-push-action/releases/tag/v6.9.0
        with:
          context: .
          file: src/onemail/om-ecs-dispatcher/docker/Dockerfile
          provenance: false
          push: true
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest
          build-args: |
            NODE_VERSION=${{ steps.node-version.outputs.version }}
          # GHA layer cache: installer stage is reused when package.json/lockfile are unchanged
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition om-${REGION_SHORT}-${ENV_SHORT}-dispatcher \
            --query taskDefinition > ./task-definition.json
          echo "$(jq 'del(
            .taskDefinitionArn,
            .requiresAttributes,
            .compatibilities,
            .revision,
            .status,
            .registeredAt,
            .registeredBy
          )' ./task-definition.json)" > ./task-definition.json
        env:
          REGION_SHORT: ${{ env.REGION_SHORT }}
          ENV_SHORT: ${{ env.ENV_SHORT }}

      - name: Render updated task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@4225e0b507142a2e432b018bc3ccb728559b437a # v1.2.0 https://github.com/aws-actions/amazon-ecs-render-task-definition/releases/tag/v1.2.0
        with:
          task-definition: ./task-definition.json
          container-name: om-ecs-dispatcher
          image: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy updated task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@0e82244a9c6dac43d70151a94c67ebc4bab18fc5 # v2.2.0 https://github.com/aws-actions/amazon-ecs-deploy-task-definition/releases/tag/v2.2.0
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: om-${{ env.REGION_SHORT }}-${{ env.ENV_SHORT }}-dispatcher
          cluster: om-${{ env.REGION_SHORT }}-${{ env.ENV_SHORT }}-ecs
          wait-for-service-stability: true
