name: Deploy Lambda

on:
  workflow_call:
    inputs:
      lambda_name:
        description: 'Short lambda identifier used in resource naming (e.g., sender, config-set-processor)'
        type: string
        required: true
      build_script:
        description: 'pnpm build script name (e.g., build:sender)'
        type: string
        required: true
      package_script:
        description: 'pnpm package script name (e.g., package:sender)'
        type: string
        required: true
      lambda_s3_key_var:
        description: 'Name of the environment variable holding the Lambda S3 key (e.g., LAMBDA_SENDER_KEY)'
        type: string
        required: true
      event_name:
        description: 'Original triggering event name for matrix resolution'
        type: string
        required: true
      environment_input:
        description: 'Environment from workflow_dispatch input'
        type: string
        required: false
        default: ''
      bypass_security_checks_manual:
        description: 'Bypass security checks flag from workflow_dispatch input: use only with proper authorization'
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  setup-matrix:
    name: Setup Environment Matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 https://github.com/actions/checkout/releases/tag/v4.3.1

      - name: Setup Matrix
        id: matrix
        uses: ./.github/actions/env-matrix
        with:
          event_name: ${{ inputs.event_name }}
          environment_input: ${{ inputs.environment_input }}

  security-checks:
    name: Security Checks
    uses: ./.github/workflows/security-gates.yml
    with:
      bypass_security_checks_manual: ${{ inputs.bypass_security_checks_manual }}

  build:
    name: Build Lambda Artifact
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # Depends on setup-matrix to skip the build when matrix resolution fails
    needs: [setup-matrix, security-checks]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 https://github.com/actions/checkout/releases/tag/v4.3.1

      - name: Setup Node.js
        uses: ./.github/actions/node-setup

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Lambda
        env:
          BUILD_SCRIPT: ${{ inputs.build_script }}
        run: pnpm run "${BUILD_SCRIPT}"

      - name: Create Lambda zip package
        env:
          PACKAGE_SCRIPT: ${{ inputs.package_script }}
        run: pnpm run "${PACKAGE_SCRIPT}"

      - name: Archive build artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3 https://github.com/actions/upload-artifact/releases/tag/v4.3.3
        with:
          name: om-lambda-${{ inputs.lambda_name }}
          path: ./om-lambda-${{ inputs.lambda_name }}.zip

  deploy:
    name: Deploy Lambda OneMail ${{ inputs.lambda_name }} ${{ matrix.environment }}
    timeout-minutes: 20
    if: ${{ needs.setup-matrix.outputs.matrix != '' }}
    runs-on: ubuntu-22.04
    needs: [setup-matrix, security-checks, build]
    strategy:
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    continue-on-error: false
    environment: ${{ matrix.environment }}
    env:
      ENV_SHORT: ${{ fromJSON('{"dev":"d","uat":"u","prod":"p"}')[matrix.environment] }}
      LAMBDA_NAME: oml-${{ fromJSON('{"dev":"d","uat":"u","prod":"p"}')[matrix.environment] }}-eus1-lambda-${{ inputs.lambda_name }}
      ARTIFACT_NAME: om-lambda-${{ inputs.lambda_name }}
      LAMBDA_S3_KEY: ${{ vars[inputs.lambda_s3_key_var] }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7 https://github.com/actions/download-artifact/releases/tag/v4.1.7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2 https://github.com/aws-actions/configure-aws-credentials/releases/tag/v4.0.2
        with:
          role-to-assume: ${{ vars.IAM_ROLE_DEPLOY_LAMBDA }}
          aws-region: ${{ matrix.region }}

      - name: Upload Lambda zip to S3
        run: |
          aws s3 cp "./${ARTIFACT_NAME}.zip" "s3://${{ vars.LAMBDA_CODE_BUCKET_NAME }}/${LAMBDA_S3_KEY}"

      - name: Deploy Lambda function
        run: |
          aws lambda update-function-code \
            --function-name "${LAMBDA_NAME}" \
            --s3-bucket "${{ vars.LAMBDA_CODE_BUCKET_NAME }}" \
            --s3-key "${LAMBDA_S3_KEY}"
