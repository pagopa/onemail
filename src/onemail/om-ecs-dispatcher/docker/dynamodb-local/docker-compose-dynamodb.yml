services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest@sha256:7ef4a2c45b58c2901e70a4f28e0953a422c2c631baaaf5e2c15e0805740c7752
    container_name: om-dynamodb-local
    ports:
      - '8000:8000'
    command: '-jar DynamoDBLocal.jar -sharedDb'
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal

  # DynamoDB Admin UI
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest@sha256:46d9c7f5234688481a807987113ab068acaa11fd7057c9bb84ef181f492a0194
    container_name: om-dynamodb-admin
    ports:
      - '8001:8001'
    env_file:
      - '../../.env'
    environment:
      - DYNAMO_ENDPOINT=${AWS_DYNAMODB_ENDPOINT:-http://dynamodb-local:8000}
      - AWS_REGION=${AWS_REGION:-eu-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
      - PORT=8001
    depends_on:
      - dynamodb-local

volumes:
  dynamodb-data:
